# The GOG Complete map editor image (`homm3 --image h3maped`): h3maped.exe,
# config/project.toml [inputs.h3maped]. One unit per compiled object; a unit
# whose source the game also compiles is the SAME file, built here with this
# image's profile. Its function addresses come from the image's placements
# (config/retail/h3maped/placements.tsv), never from the game's VA() claims.
#
# Profiles (editor-plan.md section 4, fingerprinted against retail):
#   map editor objects          /O1 /Ob2 /GR, default __cdecl, NDEBUG:
#                               GameMap.cpp's anonymous helpers and
#                               computeAdjacentDirs take stack arguments
#                               and the caller pops them; no assert text
#                               survives although Loki's same functions
#                               assert. Error.cpp, ObjectType.cpp,
#                               GzBuf.cpp and the traits files are editor
#                               objects (h3maped InitializeHeroTraits and
#                               ResourceManager callers use __cdecl).
#   random map generator        /O1 /Ob2 /GR /Gr: flipRmgEdge (0x4cc68e)
#                               reads its argument from ecx
#   prebuilt Libraries archive  /O2 /GR, default __cdecl (GetText 0x4dca60
#                               reads its name from the stack)
#   zlib and Victor             the game's prebuilt objects, byte-identical

[build]
compiler = "msvc6.0"
platform = "win32"
# The SP3 MFC overlay (homm3.init.mfc_sp3) precedes the toolchain's RTM MFC
# headers; both precede the project's.
includes = [
  "build/mfc-sp3/include",
  "build/homm3-toolchain-vc6-sp3/msvc/mfc/INCLUDE",
  "include",
  "vendor/bink-0.5a/include",
  "vendor/ifc-2.0.3/include",
  "vendor/miles-5.0e/include",
  "vendor/smacker-3.2h/include",
  "vendor/zlib-1.1.3",
]
analysis_profile = "h3maped_o1_ob2_gr_windows"

[flags]

zlib_o2_ml_gr_c_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/ML",
  "/Gr",
  "/TC",
  "/D_WINDOWS",
]

victor_o2_ml_gd_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Ob2",
  "/ML",
  "/Gd",
  "/D_WINDOWS",
]

victor_kernels_o2_ogoff_ml_gd_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Og-",
  "/ML",
  "/Gd",
  "/D_WINDOWS",
]

h3maped_o1_ob2_gr_windows = [
  "/nologo",
  "/c",
  "/O1",
  "/Ob2",
  "/Op",
  "/MT",
  "/Gr",
  "/GX",
  "/GR",
  "/D_WINDOWS",
]

editor_o1_ob2_gr_windows = [
  "/nologo",
  "/c",
  "/O1",
  "/Ob2",
  "/Op",
  "/MT",
  "/GX",
  "/GR",
  "/DNDEBUG",
  "/D_WINDOWS",
]

libraries_o2_gr_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Op",
  "/MT",
  "/GX",
  "/GR",
  "/D_WINDOWS",
]

# zlib 1.1.3, the game's prebuilt objects
