# Further linked programs (`image = true`), selected with `homm3 --image KEY`.
# The GOG Complete 4.0 map editor (identical in the Collector's and Platinum
# pressings): VC6 SP3, /O1 /Ob2 /GR, MFC 4.2 (SP3 NAFXCW) linked statically.
[inputs.h3maped]
name = "GOG Complete map editor"
image = true
path = "build/orig/h3maped.exe"
size = 2134016
sha256 = "4480fba145c9f885942cc668d4bce430fe39c0fa482d1a6e58f96318ab857a37"
env = "HOMM3_H3MAPED_EXE"
option = "--exe"
image_base = 0x400000
# VC6 emits a catch block inside its function's COMDAT, after the body:
# the census folds such a handler into its parent's extent, as the game's
# hand-owned census does (homm3.census, funclets.tsv).
census_folds_catch_handlers = true
# A placed body's call past the first byte where it leaves retail names a
# callee only when four bytes before it agree, the callee's own body equals
# retail there, or nothing else names that callee or address
# (homm3.census.placements).
placements_prove_late_calls = true
# Its own sources and headers: src/editor/ and include/editor/, the
# original's `C:\Dev\Heroes 3 Exp 2\Editor\` (RTTI anonymous-namespace paths).
sources = "editor"

# The GOG Complete 4.0 campaign editor (identical in the Collector's and
# Platinum pressings; the SoD 3.0 build differs): VC6 SP3, MFC 4.2 (SP3
# NAFXCW) linked statically.
[inputs.h3ccmped]
name = "GOG Complete campaign editor"
image = true
path = "build/orig/h3ccmped.exe"
size = 1212416
sha256 = "93e98214c1d21d320281f3ef6b8db5bb2ab5a1056b84bf0cf34815d01f7533c1"
env = "HOMM3_H3CCMPED_EXE"
option = "--exe"
image_base = 0x400000
# VC6 emits a catch block inside its function's COMDAT, after the body:
# the census folds such a handler into its parent's extent, as the game's
# hand-owned census does (homm3.census, funclets.tsv).
census_folds_catch_handlers = true
# Its own sources and headers: src/campaign_editor/ and
# include/campaign_editor/, the original's
# `C:\Dev\Heroes 3 Exp 2\CampaignEditor\` (RTTI anonymous-namespace paths).
sources = "campaign_editor"

