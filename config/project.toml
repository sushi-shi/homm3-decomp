# Project facts consumed at operation boundaries, never inferred from sibling repos.
[inputs.retail]
name = "retail executable"
path = "build/orig/HEROES3.EXE"
size = 2732032
sha256 = "057c9d88e7206f6669a4615de2c6e02ab6c4e2d570a9e2badf07fe0bd6247274"
env = "HOMM3_EXE"
option = "--exe"
image_base = 0x400000

[inputs.dreamcast]
name = "Dreamcast executable"
path = "build/orig/dreamcast/H3.EXE"
size = 8425752
sha256 = "cdbc7e75bd7d057171fa12b728aaaee01c1db133fff350b034950dd21dd07736"
env = "HOMM3_DREAMCAST_EXE"
option = "--dreamcast-exe"

[inputs.mac]
name = "Classic Mac PowerPC executable"
path = "build/orig/mac/Heroes_III_raw.pef"
size = 3418835
sha256 = "650be8880cfda81ffa7704ce3bcdb9c5a6528f67afdf77c0c0c63e8259250d86"
env = "HOMM3_MAC_EXE"
