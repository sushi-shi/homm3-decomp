# Units that name a non-default `compiler` in config/units.toml. `env` is
# exported by `nix develop .#build`; `locations` are manually unpacked trees.
# msvc5.0: Visual C++ 5.0 SP3 (C1XX/C2 11.00.7303), the compiler of the
# statically linked Victor library objects (see docs/vc6/victor-library.md).
[toolchain.compilers."msvc5.0"]
env = "HOMM3_MSVC5_DIR"
locations = ["build/homm3-toolchain-vc5-sp3/msvc"]

# msvc6-rtm: Visual C++ 6.0 RTM (C1/C2 12.00.8168, LINK 6.00.8168), the compiler of the
# statically linked zlib objects: retail's Rich header counts them under
# Utc12_C 8168 and has no 8447 C entry (docs/reference/executable-libraries.md).
# `homm3 init` (homm3.init.vc6_rtm) builds the overlay at `locations`: the
# pinned SP3 tree with these RTM passes in bin/. The binaries are staged
# outside the repository at `source` (VSE600EUN1.ISO VC98/BIN, provenance in
# its PROVENANCE.txt); CL.EXE is byte-identical to the SP3 driver.
[toolchain.compilers."msvc6-rtm"]
env = "HOMM3_MSVC6_RTM_DIR"
locations = ["build/homm3-toolchain-vc6-rtm/msvc"]
source = "../orig/vc6-rtm"

[toolchain.compilers."msvc6-rtm".files]
"C1.DLL" = "ee14a2603a1339f95db2e396751f7e51b50e421731229fb2416a01f974689d80"
"C2.DLL" = "45187b0b6288240f73272a7c61e6329c50048a76e57db3bb87b6f0229e09e27d"
# LINK/LIB 6.00.8168: the linker that wrote retail's Linker600 8168 import
# objects (homm3.build.import_libraries).
"LINK.EXE" = "08d3a4c9701c8f6c871b2c48bd74d07422aa1f86e5d9a4ddb2c9bd6a88b857e7"

# The C runtime LINK.EXE runs against for the game link (homm3.build.link):
# LINK sorts each DLL's import thunks with this runtime's qsort, so it decides
# the IAT order. VC6 SP3's MSVCRT.DLL 6.00.8397, from the pinned SP3 media's
# cabinets (os/system/msvcrt.dll); staged in build/linker-runtime/.
[toolchain.linker_runtime]
media = "../orig/toolchain-media/sp3/cabs"
member = "os/system/msvcrt.dll"
sha256 = "2d5670881a6d13a100e37da297f6eeb876f68b63073a28eb5d650625c60f9bf7"
