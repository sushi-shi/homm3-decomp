[build]
compiler = "msvc6.0"
platform = "win32"
includes = [
  "include",
  "vendor/bink-0.5a/include",
  "vendor/ifc-2.0.3/include",
  "vendor/miles-5.0e/include",
  "vendor/smacker-3.2h/include",
  "vendor/zlib-1.1.3",
]
analysis_profile = "game_o2_mt_gr_windows"

[header_comparisons]
"0x0042b9e0" = "town"

[flags]

zlib_o2_ml_gr_c_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/ML",
  "/Gr",
  "/TC",
  "/D_WINDOWS",
]

victor_o2_ml_gd_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Ob2",
  "/ML",
  "/Gd",
  "/D_WINDOWS",
]

victor_kernels_o2_ogoff_ml_gd_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Og-",
  "/ML",
  "/Gd",
  "/D_WINDOWS",
]

game_o2_mt_gr_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Ob2",
  "/Oy-",
  "/Op",
  "/MT",
  "/Gr",
  "/GX",
  "/D_WINDOWS",
]

