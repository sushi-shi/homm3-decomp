# Translation units currently admitted to the matching build.

[build]
compiler = "msvc6.0"
platform = "win32"

[flags]
zlib_o2_ml_gr_c_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/ML",
  "/Gr",
  "/TC",
  "/D_WINDOWS",
]
# Game C++ profile (2026-08-04, proven on the first three matches):
# /Gr from retail's fastcall free functions (Random takes ecx/edx);
# /Oy- from IsMember - retail keeps EBP frames wherever stack access
# exists (frameless GetNumArmies proves the frame is conditional, so
# this is /O2 /Oy-, not /O1 or /Od). /Ob2 proven 2026-08-06 by the
# heroWindow::BroadcastMessage pair: both out-of-line bodies exist in
# retail AND their loops are inlined into WidgetSet/ClearStatus in the
# same TU - auto-inlining with unconditional emission, which /Ob1
# cannot produce. /Op (improve float consistency) proven ENGINE-WIDE
# 2026-08-07: ai_combat and ai_tactical independently byte-require it
# (fdiv kept against the pool constant vs reciprocal fmul; int->double
# rounded through memory; CRT sqrt instead of fsqrt - /Op disables FP
# intrinsics), and the all-TU sweep left every exact function exact.
# Refined as game TUs accumulate.
game_o2_ml_gr_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Ob2",
  "/Oy-",
  "/Op",
  "/ML",
  "/Gr",
  "/GX",
  "/D_WINDOWS",
]
# campaignbrief.obj's NewSMapHeader destructor and bottomviewsubwindow.obj's
# strstreambuf constructor contain std::_Lockit scopes around Dinkumware
# runtime state. /ML removes those calls; /MT reproduces both retail bodies
# while leaving the campaign-window destructor unchanged.
game_o2_mt_gr_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Ob2",
  "/Oy-",
  "/Op",
  "/MT",
  "/Gr",
  "/GX",
  "/D_WINDOWS",
]
# RETIRED 2026-08-07 (game_o2_ml_gr_windows_noeh): the "first no-EH TU"
# inference was wrong. sample.obj's frameless ~sample does NOT exclude
# /GX - it only proves `operator delete` was visible as nothrow, exactly
# the ai_combat lever. Its ctor 0x566da0 carries a full fs:[0] frame
# (the `new` can throw with the resource base still to unwind), which no
# non-/GX compile can emit. With /GX + the nothrow redeclaration all
# three sample functions are byte-exact, so the engine has ONE C++
# profile and this variant has no users.

# Verbatim zlib 1.1.3 release sources. This is the only component in the build
# until another translation unit and its compiler profile are reviewed.
