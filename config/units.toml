# Translation units currently admitted to the matching build.

[build]
compiler = "msvc6.0"
platform = "win32"

[flags]
zlib_o2_ml_gr_c_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/ML",
  "/Gr",
  "/TC",
  "/D_WINDOWS",
]
# Game C++ profile (2026-08-04, proven on the first three matches):
# /Gr from retail's fastcall free functions (Random takes ecx/edx);
# /Oy- from IsMember - retail keeps EBP frames wherever stack access
# exists (frameless GetNumArmies proves the frame is conditional, so
# this is /O2 /Oy-, not /O1 or /Od). Refined as game TUs accumulate.
game_o2_ml_gr_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Oy-",
  "/ML",
  "/Gr",
  "/GX",
  "/D_WINDOWS",
]

# Verbatim zlib 1.1.3 release sources. This is the only component in the build
# until another translation unit and its compiler profile are reviewed.
[[unit]]
unit = "adler32"
source = "vendor/zlib-1.1.3/adler32.c"
flags = "zlib_o2_ml_gr_c_windows"

