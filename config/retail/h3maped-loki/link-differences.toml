# The differences between `homm3 loki link`'s output and the Loki h3maped image that no pinned
# link input closes: reviewed retail facts, checked by `homm3 loki link-diff` (the link gate).
#
# The gate aligns each allocated section with the image piece by piece (exported .dynsym
# symbols anchor the pieces) and accepts a differing word only as the image's address (or
# GOT-relative offset) translated by that alignment. Every other differing byte, and every
# linked byte with no image counterpart, must lie in a region below and stay within its byte
# count. Regions are image addresses unless `linked = true`; ELF header and section headers are
# file offsets. Keep each count at what the link produces: a smaller count fails nothing but
# should be tightened, a larger one fails the gate.
#
# None remain: the link reproduces the image byte for byte. The last two were closed by
# reconstructed link inputs: zlib's deflate_copyright
# (config/loki/patches/zlib-1.0.8-deflate-copyright.patch) and the imported X symbols' sizes
# (the stub X libraries generated from config/retail/h3maped-loki/x-imports.tsv). A new
# difference is a [[difference]] table (id, cause, evidence, closes) with [[difference.region]]
# entries (where; start and end, or symbols or imports with an optional field; bytes), as
# homm3.loki.linkdiff.facts reads them.
