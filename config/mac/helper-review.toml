# Units whose Mac-retained game calls were reviewed across all Windows functions.
# A function counts as handled only when it also has a paired Mac caller span.
# Castle and strip each duplicate one broadcast call across Mac branch arms;
# initializeGameData's VA annotates its forward declaration, whose definition
# contains the three retained setup calls.
# Cursor's turnTo now calls stopCursor(0); remaining artifact/canLand calls
# are nested in the authored hero helpers. UI sendMessage calls also survive
# through authored hide/status helpers in adventuremapwindow, hiscore, viewwrld.
# Hero's remaining unidentified calls are bitset operations and strcmp;
# sprite wrapper calls, implicit UI construction and text-vector teardown
# are already expressed by the ordinary source. Town's assembled-Legion
# call is an evidenced Mac-only helper boundary.
# Town's remaining unnamed target at 0x1b43a4 returns the vector<town>
# backing pointer; destroyExtraCapitol then indexes it by townId*0x15c.
# Mac and Windows drawing::drawCombatHero both reach CSprite::drawCreature;
# csprite.h's authored bitmap facade forwards to that canonical body.
# General-text operator[] is also a canonical wrapper: Mac shipyard-event
# callers reach MSL vector<char*>::operator[] at 0x2a0c through it.
# The remaining AI sort, deque subscript, town-vector subscript and strcat
# targets in the small combat/UI units below are canonical library calls.
# Spells' unpaired targets are set/tree insertion and vector append; its
# markTowerArmy calls live inside markCreatureEffect. Sacrifice-window targets
# are container/string operations and its widget messages follow setVisible.
# Puzzle-window's corrected span excludes a neighboring global initializer;
# the remaining object-type call follows the authored cell accessor.
# Scenario-info's conditional hero portrait chooses one of two call sites;
# both are the single authored getBitmap816 expression.
# Tradpost's four creature-slot controls use setWidgetOff in Mac but
# setWidgetDisabled in Windows source; the latter emits message code 5 in
# retail, so this is a port difference in the owning update method.
# Town-manager's unnamed targets are an empty destructor and vector begin;
# strip/townObject destructor calls follow the authored deletes. Mac's
# tavern modal path calls videoRestart where Windows source uses videoResume.
# Victory/loss-condition unknown targets are bitset count and vector
# push/erase operations already present at the owning call sites.
# Command now calls resetMouse at all four Mac-retained sites and uses the
# canonical markCreatureEffect in addArmy; other call leads are nested
# RAII/container calls or ordinary helper bodies.
# Army's remaining unnamed calls are member construction/destruction,
# vector/iterator operations and formatting; named cancel/damage calls
# follow the authored enclosing helpers.
# Events' direct targets include the authored wait/waitForLevels calls;
# the other unmapped targets are object and vector construction/teardown.
# Small UI, flight, network and army-group targets below resolve to authored
# accessors, member constructors, bitset methods or their enclosing wrappers.
# Swap's unpaired viewMon target is the already authored member; combat text,
# search, scroller and object-name targets are string/vector/auto_ptr methods.
# Combat-manager unknown targets are abs and container lifecycle operations;
# markTowerArmy is nested in the authored markCreatureEffect wrapper.
# Adventure-manager's unpaired net-message targets are the authored handler
# methods/base dispatch; its Mac string reverse and hourglass lifecycle follow
# existing calls and RAII. The remaining geometry/artifact calls are nested.
# Quest and event-record targets resolve to authored constructors, virtual
# methods, string/bitset accessors and vector lifecycle calls.
# Resource-manager's cache targets are the authored map insert/find; the
# multiplayer dialog's nested calls come from inline constructors and the
# ordinary modal/host helpers.
# Smacker's frame wrapper now calls the retained Mac helper; its screen update
# is inside the Mac playback body. Gzip's eight getByte calls are inside the
# authored readByte wrapper; LODHeader is an implicit member constructor.
# Mac preference resources, event polling, file enumeration and audio/video
# backends use different platform routines from their Windows counterparts.
# Mac window fades call GameTime::delay where Windows keeps deadline-based
# delayTil; their bitmap construction is already expressed as local objects.
# Mouse and graphics targets are Mac cursor/QuickDraw services. Mac sound
# volume conversion and stream control use its native audio backend.
# The oldmain and dialog-loop targets in kb are authored menu calls, implicit
# dialog/member construction and teardown, plus Mac event services; its eight
# repeated 0xe924c calls are a scalar deleting destructor.
# Single-selection's sort arms call authored std::sort predicates; repeated
# unnamed targets are STL, accessors and message object lifecycle. Its log
# calls are g_logFile.log, onNameChange follows onEnter, and Mac host-wait
# dialogs use sRandom for presentation absent from the Windows dialog path.
# AI-player unnamed targets are retained object construction, artifact-effect
# subclasses and vector operations around the authored purchase, path and
# destination calls. Its named type constructors and hero accessors are in the
# existing object expressions and helper methods.
# Mapcell's repeated unnamed targets in NewfullMap construction, read/load and
# destruction are vector/member lifecycle methods; the two common scalar
# deleting destructors and +8 accessor were checked in the PEF. Named army,
# generator and object-type calls follow existing member expressions.
# Game's loadVictoryCondition and loadLossCondition now call the two retained
# hero-ID readers. Its load/save unknowns are repeated cleanup and vector
# instantiations, map/player readers use member construction and resize, and
# the network paths use Mac platform and dialog helpers. Other named calls
# follow authored member wrappers; load/save carcasses are not active bodies.
# Remaining spellbook/campaign UI targets are STL and implicit teardown.
