evidence = "The retained body copies one GameSelectionHeadersStruct setup at+0x2c0 and hero-availability bytes at+0x4b4 into g_game, calls CMapHeaderData::assignData with the header/title/description at+0/+0x550/+0x58d, writes duration and difficulty, then sets the description widget text. RebuildFilteredPlayerSetup, two updateGameVars branches and onBeginGame call this same target. Windows previously repeated precisely these statements at all four sites. BLR0x17b1c0 precedes updateGameVars."

