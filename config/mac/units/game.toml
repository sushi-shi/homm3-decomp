mode = "paired_bodies"
# Game-TU O3 evidence: matchUndergroundGates preserves the target register-save
# range and 0x50000 base hoist (408-byte candidate vs 384-byte target, while
# O1/O2 emitted 516/440). A second body, loadMinePool, emits the same 676-byte
# linked length and every instruction except stack-frame/slot displacements
# after restoring its independently evidenced byte locals. Earlier O2/O1
# probes on this body changed its size and reduced byte agreement, so O3 is
# retained for this shared source. getNewHeroId preserves all five named calls
# at O3/O4; O2 halves its emitted size and moves the calls, so O3 stays the
# calibrated profile while its source/local layout is investigated.
flags = ["-O3", "-proc", "750", "-nolink"]
helpers = []
# Mac newMap retains this ordinary helper; compile its source once with the
# owning game unit so isolated shape probes expose the retained body and calls.
source_helpers = ["game::randomizeHeroPool", "randomizeWagon"]
