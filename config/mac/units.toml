# CodeWarrior settings for the full-TU Mac objects (`ninja mac:<unit>`),
# keyed by config/units.toml unit names.

# The retail PEF mixes optimization levels. Each unit uses the level whose
# full-TU object reproduces the most exact Mac pairs; ties keep the shared
# -O4, the best level over the whole executable (659 exact pairs against
# 607 at -O3, 426 at -O2 and 329 at -O1). The per-unit sweep is in
# docs/tooling/mac-optimization-profile.md.
# -proc 750 scheduling is calibrated on hero.
# -char unsigned scored lower: 3 hero/remote pairs, or 79 (3 exact) as a global flag.
# -nomapcr preserves ASCII newline 10; font::fillLinesVector matches both targets.
flags = ["-O4", "-proc", "750", "-nomapcr", "-nolink"]

# A unit override replaces `flags`. A disposition accounts for a unit with no
# Mac counterpart; it needs positive evidence from the Mac executable.

[units.hero]
flags = ["-O1", "-proc", "750", "-nomapcr", "-nolink"]
evidence = "Exact pairs -O1/-O2/-O3/-O4: 39/18/9/8 of 71."

[units.townmgr]
flags = ["-O1", "-proc", "750", "-nomapcr", "-nolink"]
evidence = "Exact pairs -O1/-O2/-O3/-O4: 8/5/4/4 of 24."

[units.tradpost]
flags = ["-O1", "-proc", "750", "-nomapcr", "-nolink"]
evidence = "Exact pairs -O1/-O2/-O3/-O4: 2/1/1/1 of 8."

[units.singleselectionwindow]
flags = ["-O2", "-proc", "750", "-nomapcr", "-nolink"]
evidence = "Exact pairs -O1/-O2/-O3/-O4: 2/14/8/8 of 41."

[units.rmg]
flags = ["-O2", "-proc", "750", "-nomapcr", "-nolink"]
evidence = "Exact pairs -O1/-O2/-O3/-O4: 4/7/5/5 of 55."

[units.combatresultswindow]
flags = ["-O2", "-proc", "750", "-nomapcr", "-nolink"]
evidence = "Exact pairs -O1/-O2/-O3/-O4: 1/2/1/1 of 2."

[units.forcefeedback]
disposition = "windows_only"
evidence = "IFC20.dll Immersion layer: no IFC import or its RTTI names (t_initialize_failure, CImmMouse) in the PEF."

[units.victor_pcx_kernels]
disposition = "windows_only"
evidence = "x86 __asm PCX kernels: no 0xC0 run-marker test or 0x3F count mask in the Mac code."

[units.winfile]
disposition = "platform_rewritten"
evidence = "Win32 file layer: Mac file I/O calls FSpOpenDF/FSRead/FSWrite/FSClose from 0:0x277e5c..0x2780c8."

[units.dxplay]
disposition = "platform_rewritten"
evidence = "DirectPlay layer: Mac networks over OpenTransport; no DirectPlay import."
