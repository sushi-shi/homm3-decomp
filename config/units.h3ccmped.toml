# The GOG Complete campaign editor image (`homm3 --image h3ccmped`):
# h3ccmped.exe, config/project.toml [inputs.h3ccmped]. One unit per compiled
# object; a unit whose source the game or the map editor also compiles is the
# SAME file, built here with this image's profile. Its function addresses come
# from the image's placements (config/retail/h3ccmped/placements.tsv), never
# from the VA() claims of the game or the map editor.
#
# Profiles (fingerprinted against retail):
#   campaign editor objects     /O2 /GR, default __cdecl, NDEBUG. Rich: 154
#                               C++ objects at C2 8447 (100 of them SP3
#                               NAFXCW), 24 at 8168 (LIBCPMT). Its own code
#                               opens 302 EH frames inline and calls
#                               __EH_prolog in none (the map editor's /O1
#                               calls it 1,689 times); 63 of its 4,402
#                               non-library functions keep `push ebp; mov
#                               ebp, esp`. The game's traits sources
#                               (herodefs, creaturetype, spelldefs,
#                               artifact) place by masked body under it.
#   prebuilt Libraries archive  /O2 /GR, the map editor's archive (the same
#                               ResourceManager anonymous scope)
#   zlib and Victor             the game's prebuilt objects, byte-identical

[build]
compiler = "msvc6.0"
platform = "win32"
# The SP3 MFC overlay (homm3.init.mfc_sp3) precedes the toolchain's RTM MFC
# headers; both precede the project's.
includes = [
  "build/mfc-sp3/include",
  "build/homm3-toolchain-vc6-sp3/msvc/mfc/INCLUDE",
  "include",
  "vendor/bink-0.5a/include",
  "vendor/ifc-2.0.3/include",
  "vendor/miles-5.0e/include",
  "vendor/smacker-3.2h/include",
  "vendor/zlib-1.1.3",
]
analysis_profile = "ccmped_o2_gr_windows"

[flags]

zlib_o2_ml_gr_c_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/ML",
  "/Gr",
  "/TC",
  "/D_WINDOWS",
]

victor_o2_ml_gd_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Ob2",
  "/ML",
  "/Gd",
  "/D_WINDOWS",
]

victor_kernels_o2_ogoff_ml_gd_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Og-",
  "/ML",
  "/Gd",
  "/D_WINDOWS",
]

ccmped_o2_gr_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Op",
  "/MT",
  "/GX",
  "/GR",
  "/DNDEBUG",
  "/D_WINDOWS",
]

libraries_o2_gr_windows = [
  "/nologo",
  "/c",
  "/O2",
  "/Op",
  "/MT",
  "/GX",
  "/GR",
  "/D_WINDOWS",
]

# zlib 1.1.3, the game's prebuilt objects
[[unit]]
unit = "adler32"
source = "vendor/zlib-1.1.3/adler32.c"
flags = "zlib_o2_ml_gr_c_windows"

