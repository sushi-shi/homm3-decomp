# The Loki Linux game 1.3.1a (heroes3.dynamic, config/retail/heroes3-loki/):
# compiler profile and its proof. Evidence image only; `homm3 build` never
# reads this file.
#
# .comment: 147 objects "GCC: (GNU) 2.95.2 19991024 (release)" (crtbegin, the
# project, libstdc++/libgcc) and 17 egcs-1.1.2 (crt1, crti, C libraries).
# Only the C++ runtime has .eh_frame FDEs (11 CIEs, all from 0x0820ce00 on),
# so the project objects were compiled without exceptions. RTTI is on (type
# names and __tf functions). Frame pointers are kept; epilogues are
# `mov %ebp,%esp; pop %ebp` (never `leave`, the i386 default); no cmov.

[profile]
flags = ["-O2", "-mcpu=pentium", "-funroll-loops", "-fno-exceptions"]
# -fno-strength-reduce and -march=pentium give the same proof count: undecided.

# Proof: the editor branch's engine units (byte-exact for Loki h3maped at -O0,
# the same RoE-era Loki source family) compiled under each variant and
# searched in the game image with only link-decided fields open
# (`homm3 loki-game profile`). Counts are unique exact bodies, 2026-10-09.
# AdvObjectTypeTraits.cpp and GzBuf.cpp throw, so they only compile with
# exceptions (the `exceptions` variant's larger total).
[proof]
ref = "origin/decomp-loki-1.0"
units = [
  "src/Bitmap16.cpp", "src/Bitmap24.cpp", "src/bitmap816.cpp", "src/Bitmap8.cpp",
  "src/CSequence.cpp", "src/CSprite.cpp", "src/CSpriteFrame.cpp", "src/Font.cpp",
  "src/palette.cpp", "src/resource.cpp", "src/sample.cpp", "src/SpellDefs.cpp",
  "src/Error.cpp", "src/GenericResource.cpp", "src/CreatureType.cpp", "src/HeroDefs.cpp",
  "src/Artifact.cpp", "src/AdvObjectTypeTraits.cpp", "src/lodfile.cpp", "src/GzBuf.cpp",
  "src/ResourceManager.cpp", "src/TextResource.cpp",
]

[proof.variants]
profile = ["-O2", "-mcpu=pentium", "-funroll-loops", "-fno-exceptions"]         # 199 of 510
exceptions = ["-O2", "-mcpu=pentium", "-funroll-loops"]                         # 178 of 634
no-unroll = ["-O2", "-mcpu=pentium", "-fno-exceptions"]                         # 146 of 510
unroll-all = ["-O2", "-mcpu=pentium", "-funroll-all-loops", "-fno-exceptions"]  # 179 of 510
fast-math = ["-O2", "-mcpu=pentium", "-funroll-loops", "-fno-exceptions", "-ffast-math"]  # 192 of 510
O3 = ["-O3", "-mcpu=pentium", "-funroll-loops", "-fno-exceptions"]              # 148 of 473
O1 = ["-O1", "-mcpu=pentium", "-funroll-loops", "-fno-exceptions"]              # 42 of 510
pentiumpro = ["-O2", "-mcpu=pentiumpro", "-funroll-loops", "-fno-exceptions"]  # 92 of 510
i486 = ["-O2", "-mcpu=i486", "-funroll-loops", "-fno-exceptions"]              # 105 of 510
i386 = ["-O2", "-funroll-loops", "-fno-exceptions"]                            # 2 of 510 (leave epilogues)
