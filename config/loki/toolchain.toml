# GCC 2.95.2 toolchain for the Loki h3maped image (GCC: "2.95.2 19991024 (release)" in every
# editor object). Debian 2.2 "potato" i386 packages; each matches the potato Packages index.
# Stage with `homm3 loki toolchain --debs DIR` (or HOMM3_LOKI_DEBS); see docs/loki/README.md.

[debs]
"binutils_2.9.5.0.37-1.deb" = "3b68c362559c0437b0384cb42128b33820dd4b85384a9379777e17d837278ca9"
"cpp_2.95.2-13.1.deb" = "fa2e210e6ece4941555e38a0370f6e40e394067c16c4deb5aad34b458740b9ba"
"g++_2.95.2-13.1.deb" = "fbc9577b5ae2ce4c1f5c56858b7cd60d8eb307e8ca8a21e0cceb988d2c17ecdd"
"gcc_2.95.2-13.1.deb" = "366f1c8b3bf4ae24a857efbce5eda9d8bba22282079c133bda089ac4cd0763a3"
"libc6_2.1.3-20.deb" = "0c3937f80ae515abc69d44d18b4d8d924491f4b6c6420a0bfdaf2da91c174be6"
"libc6-dev_2.1.3-20.deb" = "83616dc9a4ca97312ad06186285c8995518678e54259a16ccf20f2b3c2218d75"
"libstdc++2.10_2.95.2-13.1.deb" = "29783eb9628e9d8b924354986bb2809a076789e7dc394ec1c27b27c1eebd8609"
"libstdc++2.10-dev_2.95.2-13.1.deb" = "6cfd88a7de13c2ff4524843492a809b585c5c8b5f09102eecf94f4b48d44abed"

[driver]
version = "2.95.2"
target = "i386-linux"

# SGI STL 3.2 (tar members dated 1999-04-23). Loki's string is SGI's basic_string<char,
# char_traits<char>, allocator<char> > (_String_base), and runtime_error is SGI's
# 0x104-byte __Named_exception: these headers precede libstdc++ 2.95's own. 3.2, not 3.3:
# every object keeps __get_c_string as a non-inline static (3.3 makes it inline, which
# loads the parameter into %ebx), and fill_n<char*, unsigned, char> is the generic
# template (3.3 adds char overloads). 3.2 already has vector::_M_fill_insert.
# Stage with `homm3 loki toolchain --sgi-stl DIR` (or HOMM3_LOKI_SGI_STL).
[sgi_stl]
"stl32.tar.gz" = "4ce657852c460c6b016c470886865a6ebc575a89c82df979012a0cde094a5076"

# The assembler: binutils 2.9.1.0.25 (Slackware 7.1 d1/binutils.tgz, md5 matching the
# release CHECKSUMS.md5). Loki's objects never use the byte moffs forms (a0/a2): all 29
# absolute byte loads/stores are 8a 05 / 88 05, beside 781 a1 and 42 a3 for 32-bit ones.
# potato's as 2.9.5.0.37 emits a0 for `movb sym, %al`; 2.9.1.0.25 emits 8a 05.
# Only usr/bin/as and its libbfd are staged; cc1plus and cpp stay Debian's.
# Stage with `homm3 loki toolchain --binutils DIR` (or HOMM3_LOKI_BINUTILS).
[binutils]
"binutils.tgz" = "70a0560e929fdd4cab4b204876e6f5eb2fdb6debe5da4429b5ff12c78f8d73db"

# The compilers proper (cc1, cc1plus): vanilla GCC 2.95.2 "19991024 (release)", the
# string in every editor object's .comment, as packaged by Slackware 7.1
# (contrib/gcc-2.95.2/gcc.tgz). Debian's 2.95.2-13.1 (a 20000220 branch snapshot) emits the
# in-class inline members of a class whose vtable a TU defines as weak linkonce bodies; the
# release compiler emits them as strong .text globals in that TU, after its out-of-line
# functions, as Loki's resource.o does (get_resType .. GetReferenceCount). The Debian
# driver, cpp, specs, headers and libraries stay (Slackware's cccp rejects the SDK headers).
# Stage with `homm3 loki toolchain --gcc DIR` (or HOMM3_LOKI_GCC).
[compilers]
"gcc.tgz" = "d55eec8780baeea94e5c1ef7af0459d31495055f1d9e63fd3e95d4061d7707a4"

# GTK+ and GLib headers: GTK+ 1.2.8 and GLib 1.2.8 as packaged by Slackware 7.1
# (slakware/gtk1/gtkglib.tgz, md5 e3fb178ffed2f0c4658bd1262305ff89 matching the release
# CHECKSUMS.md5). h3maped links both statically and exports their versions:
# gtk_major/minor/micro_version 1.2.8, gtk_binary_age 8, gtk_interface_age 3 (0x083f28c0)
# and glib_major/minor/micro_version 1.2.8 (0x08413fe0), exactly this package's
# gtkfeatures.h and glibconfig.h; potato ships only 1.2.7. The port calls g_warning
# (TTextResource::GetText) and the GTK+ layer. Only usr/include/{glib.h,gmodule.h,gdk,gtk}
# and usr/lib/glib/include/glibconfig.h are staged (no X11 headers: gdkx.h and
# gdkprivate.h are unusable). Stage with `homm3 loki toolchain --gtk DIR` (or HOMM3_LOKI_GTK).
[gtk]
"gtkglib.tgz" = "7458d5f061ba14f8e6e820b6c9f395dddd57af217e22e054d33cd71531892562"
# libglade 0.14 (upstream source release, members dated 2000-03-13), from the same --gtk
# directory: only its public headers glade/{glade,glade-xml,glade-build,glade-widget-tree}.h.
# The image's statically linked libglade exports glade_set_custom_handler, glade_create_custom
# and glade_xml_build_extended_widget (new in 0.14; Slackware 7.1 ships 0.13) and lacks
# glade-xml.c's "libglade::GladeXML::tooltips" (0.15 on).
"libglade-0.14.tar.gz" = "33a2a290eec04cf1fb8a8d5e7420e7225530a5b753659bfa36ba01aaafd3a371"

# Link media (`homm3 loki toolchain --libs DIR`, or HOMM3_LOKI_LIBS): everything `homm3 loki
# link` puts beside the 103 project objects, in one directory; homm3.loki.linklibs builds the
# static libraries from these sources into build/loki/toolchain/link/ (docs/loki/README.md, Link).
#   binutils.tgz   Slackware 7.1 binutils 2.9.1.0.25 (as [binutils]): its ld. The image's
#                  section order is ld 2.9.1's: .gcc_except_table before .eh_frame, both
#                  orphans after .data (2.9.5's default script names .eh_frame first).
#   glibc.tgz      Slackware 7.1 d1 glibc 2.1.3 (md5 acb259fe03473ac48d0432662d48f575):
#                  crt1.o, crti.o, crtn.o, libc_nonshared.a, built with egcs 1.1.2 like the
#                  image's first two and last .comment entries. Shared libc/libm/libdl: potato's.
#   gettext.tgz    Slackware 7.1 d1 gettext 0.10.35 (md5 7dfb1d56c0ea1bbd5a12b0aa0f04a576): its
#                  msgfmt/xgettext on PATH while GTK+ configures, so NLS is on, as the image's
#                  bindtextdomain (gtk_init_check) and _nl_msg_cat_cntr imports show.
#   egcs-1.1.2-30.i386.rpm, cpp-1.1.2-30.i386.rpm, XFree86-devel-3.3.6-20.i386.rpm
#                  Red Hat 6.2: the egcs 1.1.2 that compiled GLib, GTK+ and zlib (it emits
#                  `.p2align 4,,7` for jump targets, Slackware's egcs `.align 16`), and the X
#                  headers GTK+ is configured with.
#   binutils-2.9.5.0.22-6.i386.rpm
#                  Red Hat 6.2: the as beside that egcs (GDK's `a0`/`a2` byte moves, nop fills).
#   XFree86-libs-3.3.6-20.i386.rpm, XFree86-libs-4.0.1-1.i386.rpm
#                  Red Hat 6.2's libX11.so.6 and libXi.so.6, Red Hat 7.0's libXext.so.6, for GTK+'s
#                  configure and the launch test. Their .dynsym order is the image's import order
#                  (XGetDeviceMotionEvents, XFreeDeviceList, ... _init; XGetVisualInfo after
#                  XShmDetach, as XFree86 4's libXext has it), not its sizes: h3maped links
#                  against stubs generated from the image (homm3.loki.xstubs,
#                  config/retail/h3maped-loki/x-imports.tsv).
#   gtk+-1.2.10-ahiguti.patch
#                  Red Hat's GTK+ i18n patch (Fedora dist-git): iswpunct/iswcntrl word breaks.
#   glibc-devel-2.1.1-6.i386.rpm, glibc-2.1.1-6.i386.rpm
#                  Red Hat 6.0: the headers libxml and libglade were compiled against
#                  (glibc 2.1's memset → __bzero macro), and the shared libc, libm and libdl
#                  h3maped is linked against (the imports' st_size values).
#   glib-1.2.8.tar.gz, gtk+-1.2.8.tar.gz
#                  the image's GLib/GTK+ (gtk_*_version 1.2.8, glib_*_version 1.2.8), built at
#                  Red Hat's -O2 -m486 -fno-strength-reduce, --with-xinput=xfree (libXi).
#   zlib-1.0.8.tar.gz
#                  the image's zlibVersion() "1.0.8"; egcs -O2 -fno-strength-reduce reproduces
#                  all 14 members' .text. Patched with 1.0.4's deflate_copyright line, as the
#                  image holds it (config/loki/patches/zlib-1.0.8-deflate-copyright.patch).
#   gcc-2.95.2.tar.gz
#                  libgcc, crtbegin/crtend and libio/libstdc++ 2.10 as a plain `make` of an
#                  i686-pc-linux-gnu 2.95.2 tree builds them: stage-1 cc1/cc1plus compiled by
#                  egcs 1.1.2 at -g -O2, target libraries at -g -O2 (default -mcpu=pentiumpro,
#                  libgcc -fPIC); that cc1plus omits exception::what()'s null test, as the image.
#   libglade-0.14.tar.gz, libxml-1.8.9.tar.gz
#                  built with the release cc1 at -O2 -mcpu=pentiumpro, as Loki built them.
[link]
"binutils.tgz" = "70a0560e929fdd4cab4b204876e6f5eb2fdb6debe5da4429b5ff12c78f8d73db"
"glibc.tgz" = "b86371883c38349f50aff0307a8ed91c6ffc31a9b97187f5525e3e7b880b955e"
